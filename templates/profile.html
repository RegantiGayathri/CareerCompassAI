<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile - CareerCompassAI</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #eef2ff,
                #f8fafc
            );

            padding: 30px;
        }

        .top-bar {
            max-width: 900px;
            margin: auto;

            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 25px;
        }

        .top-bar h1 {
            color: #1e293b;
        }

        .back-btn {
            text-decoration: none;
            background: #475569;
            color: white;

            padding: 10px 18px;

            border-radius: 8px;
        }

        .profile-container {
            max-width: 900px;
            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 10px 30px rgba(0,0,0,0.08);
        }

        .profile-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .profile-icon {
            width: 90px;
            height: 90px;

            margin: auto;

            border-radius: 50%;

            background: #4f46e5;

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 40px;

            margin-bottom: 15px;
        }

        .profile-header h2 {
            color: #1e293b;
            margin-bottom: 8px;
        }

        .profile-header p {
            color: #64748b;
        }

        .success {
            background: #dcfce7;
            color: #166534;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 12px;

            border-radius: 8px;

            text-align: center;

            margin-bottom: 20px;
        }

        .form-grid {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-weight: bold;

            color: #334155;

            margin-bottom: 8px;
        }

        input,
        textarea {
            padding: 13px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;

            outline: none;
        }

        textarea {
            min-height: 100px;

            resize: vertical;
        }

        input:focus,
        textarea:focus {
            border-color: #4f46e5;

            box-shadow:
                0 0 0 3px rgba(79,70,229,0.1);
        }

        .hint {
            color: #64748b;

            font-size: 13px;

            margin-top: 6px;
        }

        .save-btn {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 9px;

            background: #4f46e5;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        .save-btn:hover {
            background: #4338ca;
        }

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .profile-container {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .top-bar {
                flex-direction: column;

                gap: 15px;

                align-items: flex-start;
            }

        }

    </style>

</head>

<body>

    <div class="top-bar">

        <h1>👤 My Profile</h1>

        <a href="{{ url_for('dashboard') }}"
           class="back-btn">

            ← Dashboard

        </a>

    </div>


    <div class="profile-container">

        <div class="profile-header">

            <div class="profile-icon">
                👤
            </div>

            <h2>{{ user.full_name }}</h2>

            <p>
                Manage your CareerCompassAI profile
            </p>

        </div>


        {% if updated == "1" %}

            <div class="success">

                ✅ Profile updated successfully!

            </div>

        {% endif %}


        {% if error %}

            <div class="error">

                ❌ {{ error }}

            </div>

        {% endif %}


        <form method="POST">

            <div class="form-grid">


                <div class="form-group">

                    <label>
                        Full Name
                    </label>

                    <input
                        type="text"
                        name="full_name"
                        value="{{ user.full_name }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        value="{{ user.email }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="text"
                        name="phone"
                        value="{{ user.phone or '' }}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        College
                    </label>

                    <input
                        type="text"
                        name="college"
                        value="{{ user.college or '' }}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Branch
                    </label>

                    <input
                        type="text"
                        name="branch"
                        value="{{ user.branch or '' }}"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Graduation Year
                    </label>

                    <input
                        type="number"
                        name="graduation_year"
                        value="{{ user.graduation_year or '' }}"
                        min="2020"
                        max="2100"
                    >

                </div>


                <div class="form-group full">

                    <label>
                        🧠 Your Skills
                    </label>

                    <textarea
                        name="skills"
                        placeholder="Example: Python, Java, SQL, HTML, CSS, Git"
                    >{{ user.skills or '' }}</textarea>

                    <div class="hint">

                        Enter skills separated by commas.

                        Example:
                        Python, Java, SQL, Git

                    </div>

                </div>


            </div>


            <button
                type="submit"
                class="save-btn">

                💾 Save Profile

            </button>

        </form>

    </div>

</body>

</html>
